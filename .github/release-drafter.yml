name-template: v$NEXT_PATCH_VERSION
tag-template: v$NEXT_PATCH_VERSION
categories:
    - title: 💥 Breaking changes
      when:
          label: chore
    - title: 📰 Documentation
      when:
          label: documentation
    - title: 🚀 Features
      when:
          label: enhancement
    - title: 🐛 Bug Fixes
      when:
          label: bug
template: |
    ## Changes

    $CHANGES
